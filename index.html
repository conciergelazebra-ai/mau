<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lost & Found - La Zebra</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f7b24a;
  margin: 0;
  padding: 20px;
  color: #333;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* BOTÓN MENU */
.menu-btn {
  position: fixed;
  right: 50px;
  top: 20px;
  background: #111;
  color: white;
  border: none;
  padding: 25px 18px;
  border-radius: 12px;
  cursor: pointer;
  z-index: 1001;
  font-size: 18px;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  right: -1000px;
  width: 600px;
  height: 100%;
  background: white;
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: right 0.35s ease;
  z-index: 1000;
}

.sidebar.active {
  right: 0;
}

.sidebar input {
  padding: 22px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 28px
}

.sidebar button {
  padding: 38px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #111;
  color: white;
  font-size: 38px;
}

.btn-warning { background: #f39c12; }
.btn-danger { background: #e74c3c; }
.btn-reset { background: #7f8c8d; }
.btn-add { background: #c8a97e; }

/* CONTENIDO */
.contenido {
  max-width: 900px;
  margin: auto;
}

/* INICIO */
.inicio {
  height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover;
  border-radius: 30px;
}

/* CARDS */
.card {
  background: white;
  padding: 18px;
  margin: 10px auto;
  border-radius: 15px;
  max-width: 600px;
}

.vencido { border-left: 6px solid red; }
.activo { border-left: 6px solid green; }

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 1200px;
  height: 90vh;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
}

.form-container {
  flex: 1;
}

.form-container iframe {
  width: 100%;
  height: 1200px;
  border: none;
}
</style>
</head>

<body>

<h1>Lost & Found La Zebra</h1>

<!-- BOTÓN MENU -->
<button class="menu-btn" onclick="toggleMenu()">☰</button>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <input type="text" id="search" placeholder="Buscar objeto">
  <input type="date" id="date">

  <button onclick="buscar(); closeMenu()">🔍 Buscar</button>
  <button class="btn-warning" onclick="venceHoy(); closeMenu()">⏰ Vence hoy</button>
  <button class="btn-danger" onclick="vencidos(); closeMenu()">⚠️ Vencidos</button>
  <button class="btn-reset" onclick="limpiarFiltros(); closeMenu()">🧹 Limpiar</button>
  <button class="btn-add" onclick="abrirModal(); closeMenu()">➕ Agregar</button>
</div>

<!-- CONTENIDO -->
<div class="contenido">

  <div id="inicio" class="inicio">
    <h2>Lost & Found</h2>
    <p>Presiona el menú para buscar objetos</p>
  </div>

  <div id="resultados"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span onclick="cerrarModal()" style="cursor:pointer;">✖</span>
    <h2>Agregar objeto</h2>

    <div class="form-container">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe2L5zVSiviONFlpn-oTlx6btNImY0RdmpmnNIKPzjwgz8_4w/viewform?embedded=true"></iframe>
    </div>
  </div>
</div>

<script>
const sheetURL = "https://opensheet.elk.sh/1svVkZIovuBEb_OjIj0fr0x1X2ZDyMJYUfJyD2bsiAOI/Respuestas de formulario 1";

let data = [];

function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("active");
}

function closeMenu() {
  document.getElementById("sidebar").classList.remove("active");
}

/* CERRAR CON ESC */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeMenu();
});

function parseFecha(fechaStr) {
  if (!fechaStr) return null;
  fechaStr = fechaStr.split(" ")[0];

  if (fechaStr.includes("/")) {
    const p = fechaStr.split("/");
    return new Date(p[2], p[1]-1, p[0]);
  }

  const f = new Date(fechaStr);
  return isNaN(f) ? null : f;
}

function formatoISO(f) {
  return f ? f.toISOString().split("T")[0] : null;
}

function calcularVencimiento(f) {
  if (!f) return null;
  const x = new Date(f);
  x.setDate(x.getDate() + 15);
  return x;
}

async function cargarDatos() {
  const res = await fetch(sheetURL);
  data = await res.json();

  data = data.map(i => {
    const fecha = parseFecha(i.FechaRegistro || i["Fecha de registro"]);
    return {
      ...i,
      FechaRegistroISO: formatoISO(fecha),
      FechaVencimientoISO: formatoISO(calcularVencimiento(fecha))
    };
  });

  mostrar([]);
}

function mostrar(items) {
  const cont = document.getElementById("resultados");
  const inicio = document.getElementById("inicio");

  cont.innerHTML = "";

  if (!items.length) {
    inicio.style.display = "flex";
    return;
  }

  inicio.style.display = "none";

  const hoy = new Date().toISOString().split("T")[0];

  items.forEach(i => {
    const vencido = i.FechaVencimientoISO && i.FechaVencimientoISO < hoy;

    cont.innerHTML += `
      <div class="card ${vencido ? 'vencido' : 'activo'}">
        <b>${i.Descripcion || "-"}</b><br>
        Tipo: ${i.Tipo || "-"}<br>
        Fecha: ${i.FechaRegistroISO || "-"}<br>
        Encontrado por: ${i.EncontradoPor || "-"}<br>
        Vence: ${i.FechaVencimientoISO || "-"}
      </div>
    `;
  });
}

function buscar() {
  const t = document.getElementById("search").value.toLowerCase();
  const f = document.getElementById("date").value;

  let r = data.filter(i =>
    (i.Descripcion || "").toLowerCase().includes(t) ||
    (i.Tipo || "").toLowerCase().includes(t)
  );

  if (f) r = r.filter(i => i.FechaRegistroISO === f);

  mostrar(r);
}

function venceHoy() {
  const hoy = new Date().toISOString().split("T")[0];
  mostrar(data.filter(i => i.FechaVencimientoISO === hoy));
}

function vencidos() {
  const hoy = new Date().toISOString().split("T")[0];
  mostrar(data.filter(i => i.FechaVencimientoISO < hoy));
}

function limpiarFiltros() {
  document.getElementById("search").value = "";
  document.getElementById("date").value = "";
  mostrar([]);
}

function abrirModal() {
  document.getElementById("modal").style.display = "block";
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

cargarDatos();
</script>

</body>
</html>
